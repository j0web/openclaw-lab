name: Deploy Official OpenClaw

on:
  push:
    branches: [main]
    paths:
      - "official/**"
      - "scripts/deploy-official.sh"
      - ".github/workflows/deploy-official.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Lenovo
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LENOVO_HOST }}
          username: ${{ secrets.LENOVO_USER }}
          key: ${{ secrets.LENOVO_SSH_KEY }}
          port: ${{ secrets.LENOVO_PORT }}
          script: |
            bash /opt/openclaw-lab/scripts/deploy-official.sh